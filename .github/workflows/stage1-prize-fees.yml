name: QT Stage1 PoolTogether claim-other-prize fee cash evidence
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_prize_cash/**'
      - '.github/workflows/stage1-prize-fees.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Offline quota and event ABI tests
        run: python3 -m py_compile stage1_prize_cash/scan.py qt_rpc/client.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_prize_cash -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Single read-only prize fee and withdrawal census (365 RU max)
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_prize_cash/scan.py
      - name: Preserve original blockchain requests/responses and SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-prize-fee-cash
          path: |
            prize_cash_evidence/
            stage1_prize_cash/
          retention-days: 14
