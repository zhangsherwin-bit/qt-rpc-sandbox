name: QT Stage1 permissionless UNI burn basket rights (unbiased activity gate)
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_firepit/**'
      - '.github/workflows/stage1-firepit-rights.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-firepit-once-20261020
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned read-only dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Compile and check protocol-fee ABI, fixed inventory and budget
        run: python3 -m py_compile qt_rpc/client.py stage1_firepit/screen.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_firepit -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned read-only dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One source grounded Firepit read-only historical and inventory screen
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_firepit/screen.py
      - name: Preserve full response SHA, partial observations and economic uncertainty
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-uniswap-firepit-fixed-burn-rights
          path: |
            stage1_firepit_evidence/
            stage1_firepit/
          retention-days: 14
