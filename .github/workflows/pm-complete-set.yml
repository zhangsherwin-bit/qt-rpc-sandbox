name: QT Stage 1 Polymarket complete-set finite-depth and fees
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stage1_pm_complete/**'
      - '.github/workflows/pm-complete-set.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-stage1-polymarket-complete-set
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse-only syntax check
        run: python3 -m py_compile stage1_pm_complete/probe.py
      - name: Read-only public Gamma market census and live YES/NO CLOB asks with fees
        run: python3 stage1_pm_complete/probe.py
      - name: Always archive exact API request-response bodies and SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-pm-complete-set-evidence
          path: |
            pm_complete_set_evidence/
            stage1_pm_complete/
          retention-days: 14
