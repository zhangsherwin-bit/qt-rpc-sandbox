name: QT Stage1 innovative UniswapX + AA first empirical screen
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_20261019_new_sources/**'
      - '.github/workflows/stage1-innovation-uniswapx-aa.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-innovation-once-new-mechanisms
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact dependencies for unit tests
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Verify Python syntax without RPC
        run: python3 -m py_compile qt_rpc/client.py stage1_20261019_new_sources/census.py
      - name: Offline transport safeguards and exact new event ABI
        run: python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_20261019_new_sources -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install approved read-only dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Run one fixed 400-RU-max event/receipt census only at PR opening
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_20261019_new_sources/census.py
      - name: Preserve original requests, responses, SHA and unresolved errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-new-sources-20261019-evidence
          path: |
            stage1_innovation_evidence/
            stage1_20261019_new_sources/
          retention-days: 14
