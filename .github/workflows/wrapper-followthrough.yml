name: QT specialised wrapper cash follow-through
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['wrapper/**', '.github/workflows/wrapper-followthrough.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ABI decoding dependencies
        run: python3 -m pip install eth-abi==5.2.0 eth-utils==5.3.1
      - name: Syntax check
        run: python3 -m py_compile wrapper/discover.py
      - name: Collect public historical wrapper evidence
        run: python3 wrapper/discover.py
      - name: Preserve source and evidence
        if: always()
        run: |
          mkdir -p evidence/source
          cp wrapper/*.py evidence/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-wrapper-discovery-evidence
          path: evidence/
          retention-days: 14
