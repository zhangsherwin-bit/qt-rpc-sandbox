name: QT Stage1 rights-market high reward retained cash audit
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_value_rights/**'
      - '.github/workflows/stage1-value-rights.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned read-only Python libraries
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Compile, verify ABI and budget tests without any RPC
        run: python3 -m py_compile qt_rpc/client.py stage1_value_rights/tail_forensics.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_value_rights -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned read-only Python libraries
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One bounded <=115RU forensic read, zero transactions
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_value_rights/tail_forensics.py
      - name: Always save original requests, responses and method-weighted RU report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-value-rights-rare-reward-forensic
          path: |
            stage1_rights_tail_evidence/
            stage1_value_rights/
          retention-days: 14
