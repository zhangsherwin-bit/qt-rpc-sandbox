name: QT bounded keeper recovery
'on':
  push:
    paths:
      - '.github/workflows/qt-keeper-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-public-ethereum-keeper-recovery
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Materialize frozen source and historical evidence
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          files = {'qt_keeper_repair/test_replay.py': '"""Offline software controls. No test in this file executes on-chain state."""\nimport json\nfrom copy import deepcopy\nfrom pathlib import Path\nimport tempfile\nimport unittest\nfrom unittest.mock import patch\nimport replay as R\n\ndef abi(words):return \'0x\'+\'\'.join(f\'{x:064x}\' for x in words)\n\nclass RecoveryTests(unittest.TestCase):\n    def setUp(self):self.plan,self.code=R.load_inputs();self.case=self.plan[\'cases\'][1]\n    def test_source_and_runtime_reuse(self):\n        self.assertTrue(self.code.startswith(\'0x\'));self.assertLess(len(self.code[2:])//2,24576)\n    def test_all_original_receipts_match_frozen_transaction_identity(self):\n        for c in self.plan[\'cases\']:\n            self.assertEqual(c[\'transaction\'][\'hash\'],c[\'receipt\'][\'transactionHash\'])\n            self.assertEqual(c[\'header\'][\'hash\'],c[\'receipt\'][\'blockHash\'])\n            self.assertEqual(c[\'index\'],int(c[\'receipt\'][\'transactionIndex\'],16))\n    def test_budget_is_less_than_actual_remaining_block_gas(self):\n        first=self.plan[\'cases\'][0]\n        self.assertEqual(first[\'canonical_prefix_gas\'],58162340)\n        self.assertEqual(first[\'canonical_remaining_gas\'],1837660)\n        for c in self.plan[\'cases\']:self.assertLessEqual(c[\'proposed_gas_limit\'],c[\'canonical_remaining_gas\'])\n    def test_original_envelope_preserves_access_list_and_input(self):\n        c=R.original_call(self.case)\n        self.assertEqual(c[\'input\'],self.case[\'transaction\'][\'input\'])\n        self.assertEqual(c.get(\'accessList\'),self.case[\'transaction\'].get(\'accessList\'))\n        self.assertNotIn(\'maxFeePerGas\',c)\n    def test_only_code_can_be_overridden(self):\n        cfg=R.research_config(self.case,self.code)\n        self.assertEqual(cfg[\'stateOverrides\'],{R.PROBE:{\'code\':self.code}})\n        self.assertEqual(cfg[\'blockOverrides\'][\'baseFeePerGas\'],self.case[\'header\'][\'baseFeePerGas\'])\n        self.assertEqual(cfg[\'blockOverrides\'][\'gasLimit\'],self.case[\'header\'][\'gasLimit\'])\n    def test_calibration_rejects_gas_or_log_mismatch(self):\n        rec=self.case[\'receipt\'];tr={\'gasUsed\':rec[\'gasUsed\'],\'logs\':rec[\'logs\']}\n        R.calibrate(tr,rec)\n        changed=deepcopy(tr);changed[\'gasUsed\']=\'0x1\'\n        with self.assertRaises(R.EvidenceError):R.calibrate(changed,rec)\n        changed=deepcopy(tr);changed[\'logs\']=[]\n        with self.assertRaises(R.EvidenceError):R.calibrate(changed,rec)\n    def test_native_transfers_do_not_double_count_delegatecall(self):\n        tr={\'type\':\'CALL\',\'from\':\'0xa\',\'to\':R.BENEF,\'value\':\'0xa\',\'calls\':[\n            {\'type\':\'DELEGATECALL\',\'from\':\'0xa\',\'to\':R.BENEF,\'value\':\'0xa\'},\n            {\'type\':\'CALL\',\'from\':\'0xa\',\'to\':R.BENEF,\'value\':\'0x5\',\'error\':\'reverted\'}]}\n        self.assertEqual(R.native_delta(tr,R.BENEF),10)\n    def test_reverted_parent_discards_nested_logs_and_cash(self):\n        tr={\'error\':\'revert\',\'calls\':[{\'type\':\'CALL\',\'to\':R.BENEF,\'value\':\'0xa\',\'logs\':[{\'topics\':[],\'data\':\'0x\'}]}]}\n        self.assertEqual(R.native_delta(tr,R.BENEF),0);self.assertEqual(R.logs_in_trace(tr),[])\n    def test_initial_context_zero_base_fee_or_funds_rejected(self):\n        h=self.case[\'header\'];wanted=[1,int(h[\'number\'],16),int(h[\'timestamp\'],16),int(h[\'baseFeePerGas\'],16),0,0]\n        R.verify_env({\'output\':abi(wanted)},self.case)\n        for i in [0,1,2,3,4,5]:\n            bad=wanted[:];bad[i]=bad[i]+1\n            with self.assertRaises(R.EvidenceError):R.verify_env({\'output\':abi(bad)},self.case)\n    def test_lp_is_included_in_prefunding_guard(self):\n        c=R.balance_call(self.plan[\'balances_call\']);words=R.uints(\'0x\'+c[\'input\'][10:])\n        self.assertEqual(words[:2],[32,7]);self.assertEqual(words[-1],int(R.LP,16))\n        R.verify_initial_tokens({\'output\':abi([32,7]+[0]*7)})\n        with self.assertRaises(R.EvidenceError):R.verify_initial_tokens({\'output\':abi([32,7]+[0]*6+[1])})\n    def test_revert_is_not_a_zero_profit(self):\n        v=R.assess_payout({\'error\':\'execution reverted\'},self.case,{})\n        self.assertIsNone(v[\'cash_profit\']);self.assertEqual(v[\'status\'],\'REVERTED\')\n    def test_unapproved_network_methods_rejected_before_request(self):\n        with tempfile.TemporaryDirectory() as t:\n            c=R.Client(Path(t))\n            with patch(\'urllib.request.urlopen\') as urlopen:\n                with self.assertRaises(R.ProviderStopped):c.request(\'bad\',\'eth_sendRawTransaction\',[])\n                urlopen.assert_not_called()\n    def test_resource_limit_is_a_stop_not_a_profit_result(self):\n        class Response:\n            status=200\n            def __enter__(self):return self\n            def __exit__(self,*x):return False\n            def read(self,n):return b\'{"jsonrpc":"2.0","id":1,"error":{"code":-38026,"message":"Client adjustable limit reached"}}\'\n        with tempfile.TemporaryDirectory() as t,patch(\'time.sleep\'),patch(\'urllib.request.urlopen\',return_value=Response()):\n            c=R.Client(Path(t))\n            with self.assertRaises(R.EvidenceError):c.request(\'limit\',\'debug_traceCall\',[])\n            self.assertTrue(c.stopped)\n            m=json.loads((Path(t)/\'raw/001.json\').read_text());self.assertEqual(m[\'status\'],\'RPC_ERROR\')\n    def test_caller_and_price_envelope_cannot_be_silently_changed(self):\n        changed=deepcopy(self.plan[\'payout_call\']);changed[\'from\']=\'0x\'+\'11\'*20\n        with self.assertRaises(R.EvidenceError):R.call_envelope(changed,1000000)\n\nif __name__==\'__main__\':unittest.main()\n', 'qt_keeper_repair/replay.py': '"""Bounded read-only recovery of three frozen PegKeeper historical tests.\n\nThis program does not sign, broadcast, use a wallet, change live state or accept\narbitrary RPC methods/targets. The default is an OFFLINE plan. --run-public is\nrequired for the network calls. It reuses previously compiled, hash-pinned code.\nA successful original trace must match the canonical receipt before its state\ncan be used for the research payout. A failed check never becomes zero profit.\n"""\nfrom __future__ import annotations\nimport argparse\nfrom collections import Counter\nfrom copy import deepcopy\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nfrom pathlib import Path\nimport time\nimport urllib.error\nimport urllib.request\n\nROOT = Path(__file__).resolve().parent\nRPC = \'https://rpc-eth.blockmachine.io\'\nPROBE = \'0x00000000000000000000000000000000dead8822\'\nBENEF = \'0x00000000000000000000000000000000dead8821\'\nWETH = \'0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2\'\nUSDT = \'0xdac17f958d2ee523a2206206994597c13d831ec7\'\nLP = \'0x390f3595bca2df7d23783dfd126427cceb997bf4\'\nTRANSFER = \'0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef\'\nALLOWED = {\'eth_getBlockByNumber\', \'eth_getCode\', \'debug_traceCall\'}\nMAX_REQUESTS = 24\nMAX_SECONDS = 1450\nMAX_BODY = 12_000_000\nSPACING = 70\n\nclass EvidenceError(RuntimeError):\n    pass\n\nclass ProviderStopped(EvidenceError):\n    pass\n\ndef save(path: Path, value) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(json.dumps(value, indent=2, ensure_ascii=False)+\'\\n\', encoding=\'utf-8\')\n\ndef load_inputs():\n    plan = json.loads((ROOT/\'inputs/repair_plan.json\').read_text())\n    code = (ROOT/\'inputs/runtime.hex\').read_text().strip()\n    source = (ROOT/\'inputs/CashProbe.sol\').read_bytes()\n    if hashlib.sha256(bytes.fromhex(code[2:])).hexdigest() != plan[\'runtime_sha256\']:\n        raise EvidenceError(\'runtime hash mismatch\')\n    if hashlib.sha256(source).hexdigest() != plan[\'source_sha256\']:\n        raise EvidenceError(\'source hash mismatch\')\n    if len(plan[\'cases\']) != 3:\n        raise EvidenceError(\'frozen cohort changed\')\n    return plan, code\n\ndef uints(data: str) -> list[int]:\n    if not isinstance(data, str) or not data.startswith(\'0x\'):\n        raise EvidenceError(\'missing ABI return data\')\n    raw = bytes.fromhex(data[2:])\n    if len(raw) % 32:\n        raise EvidenceError(\'non-word ABI return data\')\n    return [int.from_bytes(raw[i:i+32], \'big\') for i in range(0,len(raw),32)]\n\ndef address(word: int) -> str:\n    if not 0 <= word < 2**160:\n        raise EvidenceError(\'invalid ABI address\')\n    return \'0x\'+f\'{word:040x}\'\n\ndef logs_in_trace(trace: dict) -> list[tuple]:\n    if trace.get(\'error\'):\n        return []\n    ans = [(x.get(\'address\',trace.get(\'to\',\'\')).lower(),\n            tuple(t.lower() for t in x.get(\'topics\',[])), x.get(\'data\',\'0x\').lower())\n           for x in trace.get(\'logs\',[])]\n    for child in trace.get(\'calls\',[]):\n        ans.extend(logs_in_trace(child))\n    return ans\n\ndef native_delta(trace: dict, owner: str) -> int:\n    if trace.get(\'error\'):\n        return 0\n    typ = trace.get(\'type\',\'CALL\').upper()\n    value = int(trace.get(\'value\',\'0x0\'),16)\n    frm,to = trace.get(\'from\',\'\').lower(),trace.get(\'to\',\'\').lower()\n    result = 0\n    # DELEGATECALL/CALLCODE carry context, not an additional native transfer.\n    if typ in {\'CALL\',\'CREATE\',\'CREATE2\',\'SELFDESTRUCT\'} and frm != to:\n        result += value * (int(to == owner)-int(frm == owner))\n    return result + sum(native_delta(c,owner) for c in trace.get(\'calls\',[]))\n\ndef transfer_delta(trace: dict, token: str, owner: str) -> int:\n    total = 0\n    for emitter,topics,data in logs_in_trace(trace):\n        if emitter == token and len(topics)==3 and topics[0]==TRANSFER:\n            frm=\'0x\'+topics[1][-40:];to=\'0x\'+topics[2][-40:]\n            total += int(data,16)*(int(to==owner)-int(frm==owner))\n    return total\n\ndef calibrate(original: dict, receipt: dict) -> None:\n    expected = Counter((x[\'address\'].lower(),tuple(t.lower() for t in x[\'topics\']),x[\'data\'].lower()) for x in receipt[\'logs\'])\n    if (bool(original.get(\'error\')) != (receipt[\'status\']!=\'0x1\') or\n        int(original.get(\'gasUsed\',\'0x0\'),16) != int(receipt[\'gasUsed\'],16) or\n        Counter(logs_in_trace(original)) != expected):\n        raise EvidenceError(\'original transaction-index calibration failed; no candidate profit may be reported\')\n\ndef original_call(case: dict) -> dict:\n    tx=case[\'transaction\']\n    obj={k:deepcopy(tx[k]) for k in (\'from\',\'to\',\'value\',\'gas\',\'accessList\',\'authorizationList\',\'blobVersionedHashes\',\'maxFeePerBlobGas\') if tx.get(k) is not None}\n    obj[\'input\']=tx[\'input\']\n    obj[\'gasPrice\']=case[\'receipt\'][\'effectiveGasPrice\']\n    return obj\n\ndef research_config(case: dict, code: str, index: int|None=None) -> dict:\n    h=case[\'header\']\n    return {\'tracer\':\'callTracer\',\'timeout\':\'25s\',\'tracerConfig\':{\'withLog\':True},\n            \'txIndex\':case[\'index\'] if index is None else index,\n            \'stateOverrides\':{PROBE:{\'code\':code}},\n            \'blockOverrides\':{\'number\':h[\'number\'],\'time\':h[\'timestamp\'],\n                              \'gasLimit\':h[\'gasLimit\'],\'baseFeePerGas\':h[\'baseFeePerGas\'],\n                              \'feeRecipient\':h[\'miner\'],\'prevRandao\':h[\'mixHash\']}}\n\ndef call_envelope(template: dict, gas: int) -> dict:\n    c=deepcopy(template)\n    if c.get(\'from\',\'\').lower()!=BENEF or c.get(\'to\',\'\').lower()!=PROBE or c.get(\'gasPrice\')!=\'0x0\':\n        raise EvidenceError(\'unexpected research caller, target, or funding envelope\')\n    c[\'gas\']=hex(gas)\n    return c\n\ndef balance_call(template: dict) -> dict:\n    # Add the actual keeper LP token to the six inherited inventory checks.\n    raw=template[\'input\'];words=uints(\'0x\'+raw[10:])\n    if len(words)<2 or words[0]!=32 or words[1]!=6 or len(words)!=8:\n        raise EvidenceError(\'unexpected inherited balances calldata\')\n    encoded=[32,7,*words[2:],int(LP,16)]\n    c=call_envelope(template,200_000)\n    c[\'input\']=raw[:10]+\'\'.join(f\'{v:064x}\' for v in encoded)\n    return c\n\ndef verify_env(trace: dict, case: dict) -> None:\n    if trace.get(\'error\'):\n        raise EvidenceError(\'environment diagnostic reverted\')\n    got=uints(trace.get(\'output\'))\n    h=case[\'header\']\n    wanted=[1,int(h[\'number\'],16),int(h[\'timestamp\'],16),int(h[\'baseFeePerGas\'],16),0,0]\n    if got!=wanted:\n        raise EvidenceError(\'historical context or zero-initial-native guard failed\')\n\ndef verify_initial_tokens(trace: dict) -> None:\n    if trace.get(\'error\'):\n        raise EvidenceError(\'initial token diagnostic reverted\')\n    words=uints(trace.get(\'output\'))\n    if words[:2]!=[32,7] or len(words)!=9 or any(words[2:]):\n        raise EvidenceError(\'initial inventory not independently verified zero\')\n\ndef assess_payout(trace: dict, case: dict, original: dict) -> dict:\n    if trace.get(\'error\'):\n        return {\'status\':\'REVERTED\',\'error\':trace[\'error\'],\'return_data\':trace.get(\'output\'),\n                \'cash_profit\':None,\'unavailable_is_not_zero\':True}\n    out=uints(trace.get(\'output\'))\n    if len(out)!=2 or address(out[0])!=WETH or out[1]<=0 or native_delta(trace,BENEF)!=out[1]:\n        raise EvidenceError(\'terminal native cash mismatch\')\n    if native_delta(trace,PROBE)!=0 or transfer_delta(trace,LP,PROBE)!=0 or transfer_delta(trace,USDT,PROBE)!=0:\n        raise EvidenceError(\'retained native, LP or USDT inventory\')\n    h=case[\'header\'];used=int(trace[\'gasUsed\'],16);base=int(h[\'baseFeePerGas\'],16)\n    rec=case[\'receipt\'];effective=int(rec[\'effectiveGasPrice\'],16)\n    if effective<base:raise EvidenceError(\'historical gas-price inconsistency\')\n    direct=native_delta(original,h[\'miner\'].lower())\n    tips=int(rec[\'gasUsed\'],16)*(effective-base)\n    return {\'status\':\'CASH_PAYOUT_VERIFIED\',\'native_payout_wei\':str(out[1]),\'gas_used\':used,\n            \'base_fee_cost_wei\':str(used*base),\'net_before_additional_bid_wei\':str(out[1]-used*base),\n            \'original_direct_producer_wei\':str(direct),\'original_priority_fees_wei\':str(tips),\n            \'matched_visible_payment_sensitivity_wei\':str(out[1]-used*base-direct-tips),\n            \'sensitivity_is_not_an_executed_bid\':True,\'real_upfront_gas_required\':True,\n            \'capture_probability\':None,\'retrospective_fixed_cohort\':True}\n\nclass Client:\n    def __init__(self, folder: Path):\n        self.folder=folder;self.n=0;self.last=0.0;self.start=time.monotonic();self.stopped=False\n    def request(self, label: str, method: str, params: list):\n        if method not in ALLOWED or self.stopped:raise ProviderStopped(\'method or provider stop\')\n        gap=SPACING if method==\'debug_traceCall\' else 2\n        wait=max(0,gap-(time.monotonic()-self.last))\n        if self.n>=MAX_REQUESTS or time.monotonic()-self.start+wait>MAX_SECONDS:\n            raise ProviderStopped(\'fixed request/time budget\')\n        time.sleep(wait);self.n+=1\n        pl={\'jsonrpc\':\'2.0\',\'id\':self.n,\'method\':method,\'params\':params}\n        m={\'name\':label,\'url\':RPC,\'utc\':datetime.now(timezone.utc).isoformat(),\'payload\':pl}\n        body=b\'\'\n        try:\n            req=urllib.request.Request(RPC,json.dumps(pl).encode(),headers={\n                \'Content-Type\':\'application/json\',\'Accept\':\'application/json\',\n                \'User-Agent\':\'QT-Bounded-ReadOnly-Keeper-Recovery/1\'})\n            with urllib.request.urlopen(req,timeout=40) as res:\n                m[\'http\']=res.status;body=res.read(MAX_BODY+1)\n            if len(body)>MAX_BODY:raise EvidenceError(\'response size limit\')\n            j=json.loads(body)\n            if \'error\' in j:\n                m[\'status\']=\'RPC_ERROR\';m[\'error\']=j[\'error\']\n                msg=str(j[\'error\']).lower()\n                if any(s in msg for s in [\'unauthorized\',\'forbidden\',\'rate limit\',\'request limit\',\'quota\',\'api key\',\'adjustable limit\']):\n                    self.stopped=True\n                raise EvidenceError(\'provider returned \'+str(j[\'error\']))\n            if \'result\' not in j:raise EvidenceError(\'missing JSON-RPC result\')\n            m[\'status\']=\'OK\';return j[\'result\']\n        except urllib.error.HTTPError as exc:\n            body=exc.read(100000);m.update(status=\'HTTP_ERROR\',http=exc.code,error=str(exc))\n            if exc.code in {401,403,429}:self.stopped=True\n            raise\n        except Exception as exc:\n            m.setdefault(\'status\',\'UNAVAILABLE\');m.setdefault(\'error\',str(exc));raise\n        finally:\n            self.last=time.monotonic();m[\'sha256\']=hashlib.sha256(body).hexdigest()\n            p=self.folder/\'raw\'/f\'{self.n:03d}\'\n            save(p.with_suffix(\'.json\'),m);p.with_suffix(\'.body\').write_bytes(body)\n\ndef run_public(folder: Path) -> dict:\n    plan,code=load_inputs();client=Client(folder)\n    report={\'network_execution\':\'ATTEMPTED\',\'transactions_sent\':0,\'source_reused_without_recompile\':True,\n            \'new_cash_results\':[],\'scope\':\'Three frozen historical service states; no prospective or frequency claim\'}\n    for case in plan[\'cases\']:\n        item={\'case\':case[\'label\'],\'original_transaction\':case[\'transaction\'][\'hash\']}\n        try:\n            h=case[\'header\'];block=h[\'hash\']\n            fresh=client.request(\'header\',\'eth_getBlockByNumber\',[h[\'number\'],False])\n            if fresh[\'hash\']!=block or fresh[\'parentHash\']!=h[\'parentHash\']:\n                raise EvidenceError(\'canonical block identity changed\')\n            for owner in [PROBE,BENEF]:\n                if client.request(\'unused_address\',\'eth_getCode\',[owner,case[\'parent_block\']])!=\'0x\':\n                    raise EvidenceError(\'research address already has code\')\n            cfg={\'tracer\':\'callTracer\',\'timeout\':\'25s\',\'tracerConfig\':{\'withLog\':True},\'txIndex\':case[\'index\']}\n            orig=client.request(\'original_calibration\',\'debug_traceCall\',[original_call(case),block,cfg])\n            calibrate(orig,case[\'receipt\']);item[\'original_status_gas_logs_verified\']=True\n            cfg=research_config(case,code)\n            env=client.request(\'context\',\'debug_traceCall\',[call_envelope(plan[\'env_call\'],100000),block,cfg])\n            verify_env(env,case)\n            balances=client.request(\'initial_balances\',\'debug_traceCall\',[balance_call(plan[\'balances_call\']),block,cfg])\n            verify_initial_tokens(balances)\n            candidate=call_envelope(plan[\'payout_call\'],case[\'proposed_gas_limit\'])\n            trace=client.request(\'native_payout\',\'debug_traceCall\',[candidate,block,cfg])\n            item[\'payout\']=assess_payout(trace,case,orig)\n            ctrl=client.request(\'after_original_control\',\'debug_traceCall\',[\n                candidate,block,research_config(case,code,index=case[\'index\']+1)])\n            item[\'after_original_control\']={\'status\':\'REVERTED\' if ctrl.get(\'error\') else \'RETURNED\',\n                \'error\':ctrl.get(\'error\'),\'return_data\':ctrl.get(\'output\'),\n                \'not_a_second_profit_or_prospective_capture_test\':True}\n        except Exception as exc:\n            item[\'error\']=type(exc).__name__+\': \'+str(exc)\n            item[\'not_completed_is_not_zero_profit\']=True\n        report[\'new_cash_results\'].append(item)\n        report[\'requests\']=client.n;report[\'provider_stopped\']=client.stopped\n        save(folder/\'REPORT.json\',report)\n        if client.stopped:break\n    report[\'finished_cases\']=len(report[\'new_cash_results\'])\n    report[\'all_three_economic_results_obtained\']=len(report[\'new_cash_results\'])==3 and all(\'payout\' in x for x in report[\'new_cash_results\'])\n    save(folder/\'REPORT.json\',report)\n    return report\n\nif __name__==\'__main__\':\n    parser=argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--run-public\',action=\'store_true\')\n    parser.add_argument(\'--output\',type=Path,default=Path(\'keeper_recovery_evidence\'))\n    args=parser.parse_args()\n    if not args.run_public:\n        plan,_=load_inputs()\n        print(json.dumps({\'status\':\'OFFLINE_ONLY\',\'remote_run_started\':False,\n              \'cases\':[x[\'label\'] for x in plan[\'cases\']], \'max_requests\':MAX_REQUESTS,\n              \'no_credentials_required\':True},indent=2))\n    else:\n        print(json.dumps(run_public(args.output),indent=2))\n', 'qt_keeper_repair/inputs/CashProbe.sol': '// SPDX-License-Identifier: MIT\npragma solidity 0.8.24;\ninterface Token {function balanceOf(address) external view returns(uint);function approve(address,uint) external returns(bool);function transfer(address,uint) external returns(bool);}\ninterface Wrapped {function withdraw(uint) external;function deposit() external payable;}\ninterface Flash {function flashLoan(address,uint,bytes calldata) external;}\ninterface Keeper {function update(address) external returns(uint);function pool() external view returns(address);}\ninterface Pool {function coins(uint) external view returns(address);}\ninterface Liquidator {function batchLiquidateTroves(uint[] calldata) external;function collToken() external view returns(address);}\ninterface ARM {function swapExactTokensForTokens(address,address,uint,uint,address) external returns(uint[] memory);}\ninterface WstETH {function unwrap(uint) external returns(uint);}\ninterface Auction {function want() external view returns(address);function take(address,uint,address,bytes calldata) external returns(uint);}\ninterface Router {\n struct ExactInputSingleParams {address tokenIn;address tokenOut;uint24 fee;address recipient;uint deadline;uint amountIn;uint amountOutMinimum;uin