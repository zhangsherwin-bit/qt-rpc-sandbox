name: QT Stage1 Lido pending ETH claim right market activity screen
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_lido_rights/**'
      - '.github/workflows/stage1-lido-rights.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin read-only Python dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Test ABI/rights classifications with no RPC use
        run: python3 -m py_compile stage1_lido_rights/sample.py qt_rpc/client.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_lido_rights -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin read-only Python dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One frozen 135 RU upper-bound ERC721 claim-right transfer screen
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_lido_rights/sample.py
      - name: Preserve exact original chain request/response SHA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-lido-unsteth-transferability-empirical
          path: |
            lido_unsteth_evidence/
            stage1_lido_rights/
          retention-days: 14
