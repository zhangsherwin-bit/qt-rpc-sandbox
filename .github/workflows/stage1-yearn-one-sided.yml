name: QT Stage1 Yearn one-sided real auction cash quotes
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'yearn_one/**'
      - '.github/workflows/stage1-yearn-one-sided.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qt-stage1-yearn-public-rpc-quotes
  cancel-in-progress: false
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-four-angle-census
          path: input_yearn
          run-id: 39016955510
          github-token: ${{ github.token }}
      - name: Test fixed archival auction selection, ABI and no-profit claims
        run: python3 -m unittest discover -s yearn_one -p 'test_*.py' -v
      - name: Read historical executable auction inventory and cash-exit quotes
        run: python3 yearn_one/scan.py
      - name: Retain results, failures, source and archived selection
        if: always()
        run: |
          mkdir -p yearn_evidence/source
          cp yearn_one/*.py yearn_evidence/source/
          cp .github/workflows/stage1-yearn-one-sided.yml yearn_evidence/source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qt-stage1-yearn-usdc-crvusd-auctions
          path: yearn_evidence/
          retention-days: 14
