name: QT Stage1 Frax bond redemption and Kerf keeper research
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'qt_innovation/**'
      - '.github/workflows/qt-stage1-innovation-frx-kerf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned ABI dependency
        run: python3 -m pip install pycryptodome==3.23.0
      - name: Check source and known EVM selector
        run: |
          python3 -m py_compile qt_innovation/probe.py
          python3 -c "from qt_innovation.probe import selector; assert selector('balanceOf(address)') == '0x70a08231'"
      - name: Bounded public RPC research
        run: python3 qt_innovation/probe.py
      - name: Print read-only economics and provider blockers
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('qt_new_evidence/REPORT.json')
          if p.exists():
              d=json.loads(p.read_text())
              for s in d.get('observations',[]):
                  print('ANCHOR',s.get('anchor'))
                  for r in s.get('size_results',[]):
                      print('SIZE',r['usdc_input'])
                      for v in r['routes']:
                          print('ROUTE',v)
                      print('FXB',r.get('fxb_claim_indication'))
              k=d.get('keeper',{})
              print('KEEPER',{'code':k.get('has_code'),'window':k.get('window'),'pages':k.get('pages'),'count':k.get('count'),'complete':k.get('complete')})
              print('PROVIDER',d.get('errors'),d.get('request_count'),d.get('denied_hosts'))
          else:
              print('NO REPORT - execution ended before report creation')
          PY
      - name: Preserve complete raw responses, errors and anchors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-innovation-frax-kerf-20261019
          path: |
            qt_new_evidence/
            qt_innovation/probe.py
          retention-days: 14
