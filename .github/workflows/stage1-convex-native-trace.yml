name: QT Stage1 Convex actual native-cash trace (one frozen tx)
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_convex_native_trace/**'
      - '.github/workflows/stage1-convex-native-trace.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned read-only dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Offline parser, original receipt and spend-guard tests
        run: python3 -m py_compile stage1_convex_native_trace/trace.py qt_rpc/client.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_convex_forensic -p 'test_*.py' -v && python3 -m unittest discover -s stage1_convex_native_trace -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One read-only debug_traceTransaction and ETH delta, <=35 RU
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_convex_native_trace/trace.py
      - name: Archive trace and report including error states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-convex-native-cash-trace
          path: |
            convex_native_trace_evidence/
            stage1_convex_native_trace/
          retention-days: 14
