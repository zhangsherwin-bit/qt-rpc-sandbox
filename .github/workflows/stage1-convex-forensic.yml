name: QT Stage1 frozen Convex reward-to-native-ETH forensic
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_convex_forensic/**'
      - '.github/workflows/stage1-convex-forensic.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned libraries for ABI and RPC regression
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Offline transport and frozen receipt tests
        run: python3 -m py_compile qt_rpc/client.py stage1_convex_forensic/receipt.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_convex_forensic -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ false }} # forensic read-only historical job already attempted; never duplicate 14-RU work
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned libraries
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One frozen historical executor ETH balance test, no trading
        env:
          BLOCKMACHINE_API_KEY: ${{ secrets.BLOCKMACHINE_API_KEY }}
          QT_ALLOW_AUTHENTICATED_RPC: YES
          QT_PROVIDER_ACCOUNT_RIGHTS_CONFIRMED: YES
        run: PYTHONPATH=. python3 stage1_convex_forensic/receipt.py
      - name: Preserve exact raw RPC responses and success/failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-convex-frozen-eth-balance
          path: |
            convex_frozen_evidence/
            stage1_convex_forensic/
          retention-days: 14
