name: QT keeper repair and measured cash exits
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['followthrough/**', '.github/workflows/keeper-repair.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: qt-four-angle-ethereum-research
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-four-angle-census
          path: input_census
          run-id: 39016955510
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-four-angle-cash-services
          path: input_services
          run-id: 39019940454
          github-token: ${{ github.token }}
      - name: Pinned compiler and ABI utilities
        run: python3 -m pip install eth-abi==5.2.0 pycryptodome==3.23.0 py-solc-x==2.0.5
      - name: Offline scope and source tests
        run: python3 -m unittest discover -s followthrough -p 'test_*.py' -v
      - name: Execute scoped historical cash tests
        run: python3 followthrough/run.py
      - name: Preserve source and partial evidence
        if: always()
        run: |
          mkdir -p evidence/source
          cp followthrough/*.py evidence/source/
          cp angles_probe/execute.py angles/census.py evidence/source/
          cp .github/workflows/keeper-repair.yml evidence/source/
          if test -f evidence/SUMMARY.json; then cat evidence/SUMMARY.json; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qt-keeper-repaired-cash
          path: evidence/
          retention-days: 14
