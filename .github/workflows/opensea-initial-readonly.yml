name: OpenSea initial read-only three-request test
'on':
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/workflows/opensea-initial-readonly.yml']
permissions: {}
concurrency:
  group: opensea-initial-readonly-20261021
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.repository == 'zhangsherwin-bit/qt-rpc-sandbox' &&
      github.event.pull_request.head.repo.full_name == 'zhangsherwin-bit/qt-rpc-sandbox' &&
      github.head_ref == 'research/opensea-readonly-initial-20261021' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read three fixed OpenSea endpoints with no retries
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        shell: python
        run: |
          """One-time three-request OpenSea read-only connectivity/schema test."""
          import json
          import os
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          
          BRANCH = "research/opensea-readonly-initial-20261021"
          REPO = "zhangsherwin-bit/qt-rpc-sandbox"
          MAX_BODY = 2000000
          REQUESTS = (
              ("collection_sales", "https://api.opensea.io/api/v2/events/collection/lido-steth-withdrawal-nft?event_type=sale&limit=1", "asset_events", 1),
              ("historical_item_offers", "https://api.opensea.io/api/v2/events/chain/ethereum/contract/0x889edC2eDab5f40e902b864aD4d7AdE8E412F9B1/nfts/113079?event_type=offer&after=1767225600&before=1772323200&limit=2", "asset_events", 2),
              ("current_public_listings", "https://api.opensea.io/api/v2/listings/collection/lido-steth-withdrawal-nft/all?limit=3&include_private_listings=false", "listings", 3),
          )
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def timestamp():
              return datetime.now(timezone.utc).isoformat()
          
          def run(key, opener, emit=print):
              count = 0
              def report(value):
                  text = json.dumps(value, sort_keys=True)
                  # Never rely solely on GitHub's exact-secret masking.
                  if key and key in text:
                      emit('{"status": "OUTPUT_REDACTED"}')
                  else:
                      emit(text)
              if not key or any(c in key for c in "\r\n"):
                  report({"status": "MISSING_OR_INVALID_SECRET", "requests_attempted": 0})
                  return 1
              for label, url, array_key, limit in REQUESTS:
                  count += 1
                  started = timestamp()
                  report({"request": count, "label": label, "requested_at_utc": started})
                  try:
                      request = urllib.request.Request(url, headers={"X-API-KEY": key, "Accept": "application/json"}, method="GET")
                      with opener.open(request, timeout=30) as response:
                          status = response.status
                          if status != 200:
                              raise ValueError("unexpected status")
                          body = response.read(MAX_BODY + 1)
                      if len(body) > MAX_BODY:
                          raise ValueError("body too large")
                      data = json.loads(body)
                      if not isinstance(data, dict) or not isinstance(data.get(array_key), list):
                          raise ValueError("schema")
                      items = data[array_key]
                      if len(items) > limit or any(not isinstance(x, dict) for x in items):
                          raise ValueError("unexpected items")
                      records = []
                      for item in items:
                          record = {}
                          for field in ("event_type", "order_type", "status"):
                              value = item.get(field)
                              if isinstance(value, str) and re.fullmatch(r"[a-z_]{1,40}", value):
                                  record[field] = value
                          for field in ("event_timestamp", "start_date", "expiration_date", "order_created_at"):
                              value = item.get(field)
                              if type(value) is int and 0 <= value <= 4102444800:
                                  record[field] = value
                          records.append(record)
                      report({"request": count, "label": label, "http_status": 200, "returned_count": len(items),
                              "has_next_page": bool(data.get("next")), "records": records, "completed_at_utc": timestamp()})
                  except urllib.error.HTTPError as exc:
                      report({"request": count, "label": label, "status": "STOPPED_HTTP_ERROR", "http_status": exc.code,
                              "requests_attempted": count, "stopped_at_utc": timestamp()})
                      return 1
                  except Exception:
                      # Raw error messages, response bodies and request headers are never printed.
                      report({"request": count, "label": label, "status": "STOPPED_NETWORK_OR_SCHEMA_ERROR",
                              "requests_attempted": count, "stopped_at_utc": timestamp()})
                      return 1
              report({"status": "COMPLETED", "requests_attempted": count, "pagination_requests": 0, "retry_requests": 0})
              return 0
          
          if __name__ == "__main__":
              if (os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_HEAD_REF") != BRANCH
                      or os.environ.get("GITHUB_RUN_ATTEMPT") != "1" or os.environ.get("GITHUB_EVENT_NAME") != "pull_request"):
                  print('{"status":"EXECUTION_GUARD_STOPPED","requests_attempted":0}')
                  sys.exit(1)
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              sys.exit(run(os.environ.pop("OPENSEA_API_KEY", ""), opener))
