name: QT permissionless service income census
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['service_income/**', '.github/workflows/service-income.yml']
permissions:
  contents: read
concurrency:
  group: qt-base-service-rewards
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s service_income -p 'test_*.py' -v
      - run: python3 service_income/reward_census.py
      - name: Preserve sources and failures
        if: always()
        run: |
          mkdir -p evidence/source
          cp service_income/*.py evidence/source/
          cp .github/workflows/service-income.yml evidence/source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qt-base-service-income
          path: evidence/
          retention-days: 14
