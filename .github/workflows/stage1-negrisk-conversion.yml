name: QT Stage1 negate-and-convert claim portfolios public finite book
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_negrisk/**'
      - '.github/workflows/stage1-negrisk-conversion.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-negrisk-public-once-20261021
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test frozen rights arithmetic offline
        run: python3 -m py_compile stage1_negrisk/screener.py && python3 -m unittest discover -s stage1_negrisk -p 'test_*.py' -v
  empirical:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install public HTTP client
        run: python3 -m pip install requests==2.32.3
      - name: Read up to 14 public Gamma and CLOB endpoints, no signatures
        run: PYTHONPATH=. python3 stage1_negrisk/screener.py
      - name: Save unmodified public source responses and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-negrisk-public-portfolio-audit
          path: |
            stage1_negrisk_evidence/
            stage1_negrisk/
          retention-days: 14
