name: QT Stage1 Cork Phoenix complementary-rights keyless activity screen
'on':
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stage1_cork_rights/**'
      - '.github/workflows/stage1-cork-rights.yml'
permissions:
  contents: read
concurrency:
  group: qt-stage1-cork-keyless-screen-20261020
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install deterministic source/signature dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Test exact source ABI and protections offline
        run: python3 -m py_compile stage1_cork_rights/public_probe.py qt_rpc/client.py && python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v && python3 -m unittest discover -s stage1_cork_rights -p 'test_*.py' -v
  public_probe:
    needs: offline
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact read-only dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: One keyless zero-auth-RU Cork market source/rights activity check
        run: PYTHONPATH=. python3 stage1_cork_rights/public_probe.py
      - name: Save source, SHA-indexed keyless RPC and incomplete results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-cork-phoenix-keyless-activity
          path: |
            cork_phoenix_keyless_evidence/
            stage1_cork_rights/
          retention-days: 14
