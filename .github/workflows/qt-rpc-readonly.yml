name: QT historical cash-closure challenge
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned public research dependencies
        run: python3 -m pip install pycryptodome==3.23.0 eth-abi==5.2.0 py-solc-x==2.0.5
      - name: ABI and read-only guard regression checks
        run: python3 -m unittest discover -s phase2 -p 'test_*.py' -v
      - name: Previously selected historical cash tests
        run: python3 history/replay.py
      - name: Preserve full or partial historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-historical-cash-evidence
          path: |
            history/
            phase2/midnight_codec.py
            phase2/test_phase2.py
            phase2/collect.py
          retention-days: 7
      - name: Scope
        if: always()
        run: echo 'Historical development examples only, not independent discovery. No transaction sent. Explicit time scenarios, no balance or storage overrides. All errors preserved.'
