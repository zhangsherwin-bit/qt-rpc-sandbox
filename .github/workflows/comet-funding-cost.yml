name: QT Comet same-state producer compensation funding
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['comet_funding/**', '.github/workflows/comet-funding-cost.yml']
permissions:
  contents: read
  actions: read
jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-comet-absorption-complete-cash
          path: input_cash
          run-id: 39117372686
          github-token: ${{ github.token }}
      - name: Offline inherited-state and quote checks
        run: python3 -m unittest discover -s comet_funding -p 'test_*.py' -v
      - name: Same-state producer funding quote
        run: python3 comet_funding/check.py
      - name: Keep raw request, response and source
        if: always()
        run: |
          mkdir -p funding_evidence/source
          cp comet_funding/*.py funding_evidence/source/
          cp .github/workflows/comet-funding-cost.yml funding_evidence/source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qt-comet-producer-funding-cost
          path: funding_evidence/
          retention-days: 14
