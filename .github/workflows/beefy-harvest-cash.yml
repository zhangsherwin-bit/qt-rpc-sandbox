name: QT Stage1 Beefy caller payouts — offline CI + manually gated empirical audit
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stage1_beefy_caller/**'
      - 'qt_rpc/**'
      - '.github/workflows/beefy-harvest-cash.yml'
  workflow_dispatch:
    inputs:
      run_empirical:
        description: 'Run bounded, read-only historical data collection (default NO)'
        type: boolean
        required: true
        default: false
      use_authenticated_rpc:
        description: 'Use account request units; default is keyless public read-only'
        type: boolean
        required: true
        default: false
      account_usage_permitted:
        description: 'Confirm provider-authorised account use before spending authenticated RU'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: qt-stage1-global-blockmachine-reads
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin audited Python dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Compile research scripts, no network RPC
        run: python3 -m py_compile qt_rpc/client.py qt_rpc/status_check.py stage1_beefy_caller/probe.py
      - name: Offline quota and transport regression tests
        run: python3 -m unittest discover -s qt_rpc -p 'test_*.py' -v
  harvest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_empirical == true && (!inputs.use_authenticated_rpc || inputs.account_usage_permitted == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned audited dependencies
        run: python3 -m pip install requests==2.32.3 pycryptodome==3.23.0
      - name: Execute bounded read-only research after manual gate
        env:
          BLOCKMACHINE_API_KEY: ${{ inputs.use_authenticated_rpc && inputs.account_usage_permitted && secrets.BLOCKMACHINE_API_KEY || '' }}
          QT_ALLOW_AUTHENTICATED_RPC: ${{ inputs.use_authenticated_rpc && inputs.account_usage_permitted && 'YES' || '' }}
        run: PYTHONPATH=. python3 stage1_beefy_caller/probe.py
      - name: Preserve request-response evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-beefy-caller-cash-evidence
          path: |
            beefy_caller_evidence/
            stage1_beefy_caller/
            qt_rpc/
          retention-days: 14
