name: QT Stage 1 Beefy public harvest reward cash audit
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stage1_beefy_caller/**'
      - '.github/workflows/beefy-harvest-cash.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-stage1-beefy-caller-cash
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Keccak for verifiable ABI signatures
        run: python3 -m pip install pycryptodome==3.23.0
      - name: Verify Python syntax
        run: python3 -m py_compile stage1_beefy_caller/probe.py
      - name: Execute public read-only bounded API and on-chain census
        run: python3 stage1_beefy_caller/probe.py
      - name: Preserve original request-response SHA and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qt-stage1-beefy-caller-cash-evidence
          path: |
            beefy_caller_evidence/
            stage1_beefy_caller/
          retention-days: 14
